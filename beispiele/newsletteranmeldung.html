<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="newsletterbackend.php" method="post" style="font-family: 'Comic Sans MS'">
    <fieldset>
        <legend>Anmeldung</legend>
        <label>Anrede</label><br/>
        <input id="frau" type="radio" name="anrede" value="frau"/><label for="frau">Frau</label>
        <br/>
        <input id="herr" type="radio" name="anrede" value="herr"/><label for="herr">Herr</label>
        <br/>
        <input id="divers" type="radio" name="anrede" value="divers"/><label for="divers">Divers</label>
        <br/>
        <label for="vorname">Vorname<sup>*</sup></label><br/>
        <input required id="vorname" name="vorname" type="text" placeholder="Bitte geben sie ihren Vornamen ein"/>
        <br/>
        <label for="nachname">Nachname<sup>*</sup></label><br/>
        <input required id="nachname" name="nachname" type="text" placeholder="Bitte geben sie ihren Nachnamen ein"/>
        <br/>
        <label for="email">E-Mail<sup>*</sup></label><br/>
        <input required id="email" name="email" type="email" placeholder="Bitte geben sie ihre E-Mail ein"/>
        <br/>
        <label for="benint">Benachrichtigungsinterval</label><br/>
        <select id="benint" name="benint">
            <option value="täglich">täglich</option>
            <option value="wöchentlich">wöchentlich</option>
            <option value="monatlich">monatlich</option>
        </select>
        <br/>
        <input id="datenschutz" name="datenschutz" type="checkbox"/>
        <label for="datenschutz">Datenschutzbestimmungen gelesen</label>
        <br/>
        <br/>
        <button type="submit" style="padding: 1rem; border-radius: 10%">Abschicken</button>
        <p><sup>*)</sup> Eingaben sind Pflicht</p>
    </fieldset>
</form>
</body>
</html>
